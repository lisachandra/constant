packages:
    - packages/*
    - test/*

allowBuilds:
    esbuild: true

autoInstallPeers: true

catalog:
    "@changesets/changelog-github": 0.6.0
    "@changesets/cli": 2.31.0
    "@commitlint/cli": 20.5.3
    "@commitlint/config-conventional": 20.5.3
    "@commitlint/prompt-cli": 20.5.3
    "@commitlint/types": 20.5.0
    "@isentinel/eslint-config": 6.0.0-beta.11
    "@isentinel/jest-roblox": 0.3.10
    "@isentinel/roblox-ts": 4.0.11
    "@isentinel/tsconfig": 1.2.0
    "@lisachandra/core": 0.1.1
    "@lisachandra/sandcastle": 0.2.0
    "@lisachandra/test": 0.1.0
    "@lisachandra/types": 0.1.1
    "@rbxts/compiler-types": latest
    "@rbxts/iris": 2.3.1-ts.1
    "@rbxts/jest": 3.16.0-ts.1
    "@rbxts/jest-globals": 3.16.0-ts.1
    "@rbxts/luau-polyfill": latest
    "@rbxts/services": latest
    "@rbxts/types": latest
    "@types/node": 24.10.4
    "@typescript-eslint/eslint-plugin": 8.65.0
    "@typescript/native-preview": 7.0.0-dev.20260707.2
    eslint-plugin-jest-extended: 3.0.1
    eslint-plugin-react-jsx: 5.16.1
    eslint-plugin-react-naming-convention: 5.16.1
    eslint-plugin-react-x: 5.16.1
    eslint-plugin-jest: 29.15.4
    husky: 9.1.7
    io-serve: 1.1.2
    jiti: 2.6.1
    oxfmt: 0.60.0
    oxlint: 1.73.0
    oxlint-tsgolint: 0.24.0
    rbxts-transformer-flamework: 1.3.2
    shx: 0.4.0
    tsx: 4.21.0
    typescript: 6.0.3

catalogMode: prefer

cleanupUnusedCatalogs: true

configDependencies:
    "@pnpm/plugin-trusted-deps": 0.2.2+sha512-+ZupiXKJhW2fbSilfyRp+wrAY54MKg+c0JWSFGdeb/y9bUoYN5u4XLOZ0Txk7O2bBa6NMhWrX5mwmsHP3/nm9Q==

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
    - "@isentinel/eslint-config@6.0.0-beta.11"
    - "@lisachandra/sandcastle@0.2.0"

onlyBuiltDependencies:
    - unrs-resolver
    - "@lisachandra/types"
    - "@lisachandra/test"
    - "@lisachandra/core"

overrides:
    eslint-plugin-arrow-return-style-x>@typescript-eslint/utils: 8.65.0

patchedDependencies:
    "@isentinel/roblox-ts@4.0.11": patches/@isentinel__roblox-ts@4.0.11.patch
    "@rbxts-js/expect@3.16.0-ts.1": patches/@rbxts-js__expect@3.16.0-ts.1.patch
    "@rbxts-js/jest-mock@3.16.0-ts.1": patches/@rbxts-js__jest-mock@3.16.0-ts.1.patch
    "@rbxts-js/jest-runner@3.16.0-ts.1": patches/@rbxts-js__jest-runner@3.16.0-ts.1.patch
    "@rbxts/compiler-types": patches/@rbxts__compiler-types@3.0.0-types.0.patch
    "@rbxts/jest-globals@3.16.0-ts.1": patches/@rbxts__jest-globals@3.16.0-ts.1.patch
    rbxts-transformer-flamework: patches/rbxts-transformer-flamework.patch

publicHoistPattern:
    - "*@rbxts*"
    - "*@lisachandra*"
    - "*@flamework*"
    - "*@rbxts-js*"
    - "*eslint*"

saveExact: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
    - eslint-config-prettier@9.1.2
    - semver@5.7.2
    - chokidar@4.0.3

updateConfig:
    ignoreDependencies:
        - "@types/node"
